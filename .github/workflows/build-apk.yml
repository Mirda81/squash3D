name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Sestavit hru (web)
        run: |
          npm ci
          ./build.sh
          curl -fL --retry 3 -o www/models/pose_landmarker_lite.task \
            https://storage.googleapis.com/mediapipe-models/pose_landmarker/pose_landmarker_lite/float16/1/pose_landmarker_lite.task
          mkdir -p android/app/src/main/assets
          rm -rf android/app/src/main/assets/www
          cp -r www android/app/src/main/assets/www

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Sestavit APK
        run: gradle -p android assembleRelease -Pvc=${{ github.run_number }}

      - name: Přejmenovat
        run: cp android/app/build/outputs/apk/release/app-release.apk Squash3D.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Squash3D-apk
          path: Squash3D.apk

      - name: Vydání ke stažení
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Squash 3D (build ${{ github.run_number }})
          body: Stáhni Squash3D.apk a nainstaluj na Android (povol instalaci z neznámých zdrojů).
          files: Squash3D.apk
          make_latest: true
